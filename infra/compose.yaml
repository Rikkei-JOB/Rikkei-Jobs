services:
  # Databases
  postgres:
    image: postgres:16-alpine
    container_name: rikkei-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rikkei_jobs}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rikkei-network

  # Cache & Session
  redis:
    image: redis:7-alpine
    container_name: rikkei-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rikkei-network

  # Message Broker (Optional / Future event-driven flow)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rikkei-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rikkei-network

  # Dev mail catcher: SMTP on 1025, inbox UI on http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: rikkei-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - rikkei-network

  # Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: rikkei-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgres
      - redis
    networks:
      - rikkei-network

  # Observability - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: rikkei-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - rikkei-network

  # Observability - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: rikkei-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - rikkei-network

volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  rikkei-network:
    driver: bridge
