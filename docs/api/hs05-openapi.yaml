openapi: 3.0.3
info:
  title: HS-05 Candidate profile publication
  version: 2.0.0
  description: |
    DN-03, DN-06 and UT-03 must resolve public access in profile-service for each request.
    For a single profile use CandidateProfileRepository.isPublic(userId). For set-based reads
    in profile-service join profile.public_candidate_ids before filtering, counting and paging.
    Other services can read skills via GET /api/v1/profiles/{userId}/skills with the viewer's JWT.
    For a non-owner a hidden or missing profile returns 404. Never forward the owner's identity
    for an HR lookup. Legacy rows without a recorded consent time are excluded from public reads.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /profiles/me/publish:
    post:
      summary: Submit the authenticated candidate's PRIVATE or REJECTED profile for review
      description: Sets PENDING, starts a new consent period and records SUBMIT. A missing profile is initialized through HS-02.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent]
              properties:
                consent: {type: boolean, enum: [true]}
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        '400': {description: Explicit JSON boolean true required}
        '401': {description: Missing or invalid JWT}
        '403': {description: CANDIDATE role required}
        '404': {description: Candidate identity or LMS student missing during initialization}
        '409': {description: Profile already pending or public}
        '502': {description: Invalid profile source response}
        '503': {description: Profile source unavailable}
  /profiles/me/withdraw:
    post:
      summary: Withdraw a PENDING or PUBLIC profile owned by the authenticated candidate
      description: Sets PRIVATE, timestamps withdrawal and records WITHDRAW in the same transaction.
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        '401': {description: Missing or invalid JWT}
        '403': {description: CANDIDATE role required}
        '409': {description: No pending or public profile to withdraw}
  /profiles/me/review-history:
    get:
      summary: Read the authenticated candidate's review events in reverse insertion order
      responses:
        '200':
          description: Empty array when the candidate has no events
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Review'}
        '401': {description: Missing or invalid JWT}
        '403': {description: CANDIDATE role required}
  /staff/profile-reviews:
    get:
      summary: List candidate profiles by review status (STAFF)
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [PENDING, PUBLIC, REJECTED], default: PENDING}}
        - {in: query, name: q, description: Literal substring of the candidate name (case-insensitive), schema: {type: string}}
        - {in: query, name: classCode, description: Exact class (case-insensitive), schema: {type: string}}
        - {in: query, name: courseName, description: Exact course (case-insensitive), schema: {type: string}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Ordered by consent time then user ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/QueueRow'}}
                  total: {type: integer, format: int64}
                  page: {type: integer}
                  size: {type: integer}
        '400': {description: Invalid status or pagination}
        '401': {description: Missing or invalid JWT}
        '403': {description: STAFF role required}
  /staff/profiles/{userId}/approve:
    post:
      summary: Approve a PENDING profile (STAFF)
      parameters:
        - {in: path, name: userId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {$ref: '#/components/responses/Decision'}
        '400': {description: Invalid input}
        '401': {description: Missing or invalid JWT}
        '403': {description: STAFF role required}
        '404': {description: Candidate profile missing}
        '409': {description: Profile is no longer pending}
  /staff/profiles/{userId}/reject:
    post:
      summary: Reject a PENDING profile (STAFF)
      parameters:
        - {in: path, name: userId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, description: Nonblank reason shown to the candidate}
      responses:
        '200': {$ref: '#/components/responses/Decision'}
        '400': {description: Invalid input}
        '401': {description: Missing or invalid JWT}
        '403': {description: STAFF role required}
        '404': {description: Candidate profile missing}
        '409': {description: Profile is no longer pending}
  /staff/profiles/{userId}/preview:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      summary: Preview a pending profile for STAFF, with the HR skill projection
      responses:
        '200':
          description: Review metadata and skills. Email and phone are omitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: {type: string, format: uuid}
                  fullName: {type: string}
                  classCode: {type: string}
                  courseName: {type: string}
                  headline: {type: string, nullable: true}
                  summary: {type: string, nullable: true}
                  skills: {type: array, items: {$ref: './hs01-openapi.yaml#/components/schemas/SkillProfile'}}
        '401': {description: Missing or invalid JWT}
        '403': {description: STAFF role required}
        '404': {description: Candidate profile missing}
        '409': {description: Profile has left the queue}
  /staff/profiles/{userId}/self-declared:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    put:
      summary: STAFF edits a self-declared field of a pending profile and records the reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field, value, reason]
              properties:
                reason: {type: string, minLength: 1, description: Nonblank after trimming}
              oneOf:
                - properties:
                    field: {type: string, enum: [headline]}
                    value: {type: string, maxLength: 255}
                - properties:
                    field: {type: string, enum: [summary]}
                    value: {type: string, maxLength: 5000}
                - properties:
                    field: {type: string, enum: [selfSkills]}
                    value:
                      type: array
                      description: Full replacement of SELF entries. An empty array clears all self-reported skills.
                      items:
                        type: object
                        required: [skillId, selfScore]
                        additionalProperties: false
                        properties:
                          skillId: {type: string, format: uuid}
                          selfScore: {type: number, minimum: 0, maximum: 100, multipleOf: 0.000001}
            example: {field: summary, value: Mong muốn phát triển ứng dụng Java., reason: Chuẩn hóa cách trình bày.}
      responses:
        '204': {description: Field and audit entry saved atomically}
        '400': {description: Unsupported field or invalid value or reason}
        '401': {description: Missing or invalid JWT}
        '403': {description: STAFF role required}
        '404': {description: Candidate profile missing}
        '409': {description: Profile has left the queue}
components:
  parameters:
    UserId: {in: path, name: userId, required: true, schema: {type: string, format: uuid}}
  responses:
    Decision:
      description: New visibility after the staff decision
      content:
        application/json:
          schema:
            type: object
            required: [visibility]
            properties:
              visibility: {type: string, enum: [PUBLIC, REJECTED]}
    Profile:
      description: Updated candidate profile
      content:
        application/json:
          schema: {$ref: './hs02-openapi.yaml#/components/schemas/Profile'}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    QueueRow:
      type: object
      required: [userId, fullName, classCode, courseName, consentAt, visibility, rejectCount]
      properties:
        userId: {type: string, format: uuid}
        fullName: {type: string}
        classCode: {type: string}
        courseName: {type: string}
        consentAt: {type: string, format: date-time, nullable: true, description: Most recent submission}
        visibility: {type: string, enum: [PENDING, PUBLIC, REJECTED]}
        rejectCount: {type: integer, format: int64, minimum: 0}
    Review:
      type: object
      required: [id, userId, action, actorId, createdAt]
      properties:
        id: {type: integer, format: int64}
        userId: {type: string, format: uuid}
        action: {type: string, enum: [SUBMIT, APPROVE, REJECT, WITHDRAW]}
        reason: {type: string, nullable: true}
        actorId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
