openapi: 3.0.3
info:
  title: Rikkei Jobs - company-service
  version: 1.0.0
  description: DN-01 hồ sơ doanh nghiệp và tài khoản HR; DN-05 danh sách, chi tiết công ty cho cán bộ và khoá/mở khoá HR (/staff/hr-accounts/**); DN-02 JD của HR (/jobs/**, /companies/me/jobs) và API nội bộ /internal/jobs/{jobId}/application-context cho UT-01; DN-07 trang việc làm công khai (GET /jobs, GET /jobs/{id}), cán bộ duyệt / trả lại / đóng JD (/staff/jobs/**), khoá / mở khoá công ty và lịch sử thao tác (/staff/companies/{id}/lock|unlock|history). Theo docs/conventions.md - thành công trả thẳng DTO (không bọc), mọi lỗi là { code, message, errors? } với message tiếng Việt. Đường dẫn qua gateway; company-service tự phục vụ ở /staff/companies/**, /staff/hr-accounts/**, /staff/jobs/**, /companies/**, /jobs/** (gateway bỏ tiền tố /api/v1). Riêng /internal/** không có route gateway, chỉ gọi thẳng cổng 8085.
servers:
  - url: http://localhost:8080/api/v1
    description: Qua gateway (gateway bỏ /api/v1, company-service phục vụ /staff/companies/..., /staff/jobs/..., /companies/... và /jobs/...)
tags:
  - name: staff
    description: Cán bộ tuyển dụng (role STAFF)
  - name: company
    description: HR quản lý công ty của chính mình (role HR)
  - name: job
    description: HR quản lý JD của công ty mình (role HR, DN-02). Công ty lấy từ company_hr theo userId của JWT; JD của công ty khác trả 404 giống id không tồn tại. HR của công ty LOCKED nhận 401 ACCOUNT_DISABLED ở mọi endpoint (DN-07).
  - name: public-job
    description: 'Trang việc làm công khai (DN-07), không cần đăng nhập. Một JD hiện với ứng viên khi và chỉ khi status = APPROVED, deadline >= hôm nay theo Asia/Ho_Chi_Minh và công ty ACTIVE. DN-04 sẽ thêm tham số lọc, sort và matchScore vào chính các endpoint này.'
  - name: staff-job
    description: Cán bộ duyệt / trả lại / đóng JD (role STAFF, DN-07). Mỗi thao tác ghi reviewedBy/At và một dòng lịch sử company_actions trong cùng transaction.
  - name: match
    description: Điểm khớp ứng viên với JD theo kỹ năng (DN-06). CANDIDATE xem của mình, HR/STAFF xem của ứng viên. Công thức ở docs/matching.md.
  - name: internal
    description: API nội bộ giữa service (header X-Internal-Key), KHÔNG qua gateway
paths:
  /staff/companies:
    get:
      tags: [staff]
      summary: Cán bộ xem danh sách công ty
      description: Vai trò STAFF. Tìm theo tên hoặc mã số thuế (q, không phân biệt hoa thường, % và _ được thoát), lọc theo trạng thái công ty, sắp xếp createdAt giảm dần. jdCount là số JD của công ty ở mọi trạng thái trừ DRAFT (DN-02), đếm bằng một truy vấn gom nhóm cho cả trang.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/CompanyStatus' } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Trang công ty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffCompanyPage' }
        '400':
          description: BAD_REQUEST - page/size ngoài khoảng hoặc status không hợp lệ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED - thiếu hoặc sai token, hoặc ACCOUNT_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải STAFF) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [staff]
      summary: Cán bộ tạo công ty
      description: Mã số thuế phải duy nhất. Công ty mới có status ACTIVE. Các trường chuỗi rỗng được lưu thành null.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCompanyRequest' }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyResponse' }
        '400':
          description: VALIDATION_ERROR - sai dữ liệu, ví dụ errors.taxCode = "Mã số thuế phải gồm 10 hoặc 13 chữ số"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED - thiếu hoặc sai token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải STAFF) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: CONFLICT - mã số thuế đã tồn tại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/companies/{id}/hr-accounts:
    post:
      tags: [staff]
      summary: Cán bộ cấp tài khoản HR cho công ty
      description: |
        company-service gọi API nội bộ của identity-service để tạo user (role HR, mustChangePassword=true) và gửi email mật khẩu tạm tới HR,
        rồi ghi liên kết HR - công ty. Mật khẩu tạm không bao giờ nằm trong response hay log. Gọi lại sau khi timeout: nếu identity đã tạo
        HR của đúng công ty này mà liên kết chưa ghi thì được nối tiếp và trả 201.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHrAccountRequest' }
      responses:
        '201':
          description: Đã tạo tài khoản; email mật khẩu tạm đã gửi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HrAccountResponse' }
        '400':
          description: VALIDATION_ERROR (email hoặc họ tên sai) hoặc BAD_REQUEST (identity từ chối dữ liệu)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải STAFF), MUST_CHANGE_PASSWORD hoặc COMPANY_LOCKED (công ty đang bị khoá)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có công ty với id này (hoặc id không phải UUID thì 400 BAD_REQUEST)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: CONFLICT - email đã được sử dụng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: EXTERNAL_UNAVAILABLE - không gọi được identity-service, hoặc identity trả lỗi (kể cả MAIL_UNAVAILABLE khi không gửi được email; khi đó không có user nào được tạo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/companies/{id}:
    get:
      tags: [staff]
      summary: Cán bộ xem chi tiết công ty kèm tài khoản HR
      description: Vai trò STAFF. hrAccounts lấy trạng thái từ identity-service qua API nội bộ, sắp xếp theo email; HR không còn ở identity bị bỏ qua. status của từng HR chỉ nói về khoá riêng, companyLocked là cờ khoá theo công ty (DN-07). lock (DN-07) lấy từ dòng LOCK mới nhất của lịch sử, null khi công ty ACTIVE; lockedBy.fullName null khi không tra được tên cán bộ.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Chi tiết công ty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffCompanyDetail' }
        '401':
          description: UNAUTHORIZED - thiếu hoặc sai token, hoặc ACCOUNT_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải STAFF) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có công ty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: EXTERNAL_UNAVAILABLE - không kết nối được identity-service
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/companies/{id}/lock:
    post:
      tags: [staff]
      summary: Cán bộ khoá công ty (DN-07)
      description: |
        Vai trò STAFF. Lý do bắt buộc (cắt khoảng trắng, 1-1000 ký tự). Trong một transaction có khoá dòng công ty (SELECT ... FOR UPDATE):
        đặt companies.status = LOCKED, ghi lịch sử LOCK kèm lý do, rồi gọi identity POST /internal/users/company-lock {userIds, locked: true}
        theo lô 100 cho mọi HR trong company_hr (kể cả HR đang bị khoá riêng) TRƯỚC khi commit. identity lỗi (tắt, timeout, 4xx, 5xx) → 503,
        transaction rollback, công ty và lịch sử không đổi; các lô đã gửi được gọi bù locked=false. Công ty không có HR thì không gọi identity.
        Sau khi khoá, HR không đăng nhập được (403 ACCOUNT_DISABLED ở identity), token đang còn hạn bị chặn 401 ACCOUNT_DISABLED ở identity,
        company-service (HrLockedFilter) và recruitment-service; JD APPROVED biến khỏi GET /jobs, GET /jobs/{id} trả 404; application-context
        trả companyLocked = true. JD giữ nguyên trạng thái, mở khoá là hiện lại. Tạo HR mới cho công ty bị khoá trả 403 COMPANY_LOCKED.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
            example: { reason: Đăng tin tuyển dụng sai sự thật nhiều lần }
      responses:
        '200':
          description: Chi tiết công ty sau khi khoá, lock = {lockedAt, reason, lockedBy}; hrAccounts có companyLocked = true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffCompanyDetail' }
        '400':
          description: VALIDATION_ERROR - thiếu lý do, chỉ có khoảng trắng hoặc quá 1000 ký tự (errors.reason); BAD_REQUEST - id không phải UUID, JSON hỏng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED - thiếu hoặc sai token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải STAFF) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có công ty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 'CONFLICT - "Công ty đã bị khoá"'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: 'EXTERNAL_UNAVAILABLE - "Không cập nhật được tài khoản HR, vui lòng thử lại." (identity-service lỗi); công ty không đổi, không có dòng lịch sử'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/companies/{id}/unlock:
    post:
      tags: [staff]
      summary: Cán bộ mở khoá công ty (DN-07)
      description: |
        Vai trò STAFF. Không có body. Chỉ từ LOCKED → ACTIVE; ghi lịch sử UNLOCK (reason null) và gọi identity company-lock {locked: false} cho mọi HR
        của công ty, lỗi xử lý như khoá (503, không đổi gì). HR đang bị khoá riêng (DN-05) vẫn bị khoá sau khi mở khoá công ty. JD APPROVED còn hạn
        hiện lại ở GET /jobs.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Chi tiết công ty sau khi mở khoá (lock null)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffCompanyDetail' }
        '400':
          description: BAD_REQUEST - id không phải UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED - thiếu hoặc sai token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải STAFF) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có công ty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 'CONFLICT - "Công ty không bị khoá"'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: EXTERNAL_UNAVAILABLE - không cập nhật được tài khoản HR ở identity-service; công ty vẫn LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/companies/{id}/history:
    get:
      tags: [staff]
      summary: Cán bộ xem lịch sử thao tác trên công ty (DN-07)
      description: |
        Vai trò STAFF. Khoá / mở khoá công ty và duyệt / trả lại / đóng JD của cán bộ, mới nhất trước (createdAt giảm dần, rồi id). Việc hệ thống tự
        đóng JD quá hạn không được ghi. Tên cán bộ tra theo lô qua identity lookup; identity lỗi vẫn trả 200 với staff.fullName = null.
        job null với LOCK/UNLOCK. page từ 1, size tối đa 100.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Trang lịch sử
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyActionPage' }
        '400':
          description: BAD_REQUEST - page/size ngoài khoảng, id không phải UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED - thiếu hoặc sai token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải STAFF) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có công ty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/jobs:
    get:
      tags: [staff-job]
      summary: Cán bộ xem hàng chờ / danh sách JD (DN-07)
      description: |
        Vai trò STAFF. status tuỳ chọn (bỏ trống = mọi trạng thái, dùng cho tab "JD của công ty"); companyId tuỳ chọn. Sắp: status = PENDING theo
        updatedAt tăng dần (gửi sớm nhất trước), trạng thái khác hoặc bỏ trống theo updatedAt giảm dần, rồi id. Mọi công ty, kể cả công ty bị khoá.
        page từ 1, size tối đa 100.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/JobStatus' } }
        - { name: companyId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Trang JD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffJobPage' }
        '400':
          description: BAD_REQUEST - page/size ngoài khoảng, status không phải một trong 5 giá trị, companyId không phải UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED - thiếu hoặc sai token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải STAFF) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/jobs/{id}:
    get:
      tags: [staff-job]
      summary: Cán bộ xem chi tiết JD (DN-07)
      description: Vai trò STAFF. Mọi trạng thái, mọi công ty (kể cả công ty bị khoá). reviewedBy null khi JD chưa được cán bộ xử lý; reviewedBy.fullName null khi không tra được identity-service.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Nội dung JD kèm trạng thái và thông tin duyệt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffJobDetail' }
        '400':
          description: BAD_REQUEST - id không phải UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED - thiếu hoặc sai token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải STAFF) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có JD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/jobs/{id}/approve:
    post:
      tags: [staff-job]
      summary: Cán bộ duyệt JD (DN-07)
      description: |
        Vai trò STAFF. Không có body. Chỉ PENDING → APPROVED; xoá rejectReason, ghi reviewedBy = cán bộ, reviewedAt = bây giờ, lịch sử APPROVE_JD
        (reason null). Hạn nộp trước hôm nay (Asia/Ho_Chi_Minh) → 409 JOB_EXPIRED. JD của công ty bị khoá vẫn duyệt được nhưng chỉ hiện ở trang
        việc làm khi công ty được mở khoá. Lỗi trạng thái không ghi lịch sử.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: JD đã APPROVED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffJobDetail' }
        '400':
          description: BAD_REQUEST - id không phải UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED - thiếu hoặc sai token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải STAFF) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có JD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 'INVALID_JOB_STATUS - JD không ở PENDING (ví dụ DRAFT); JOB_EXPIRED - "JD đã quá hạn nộp, hãy trả lại để HR sửa hạn nộp"; CONFLICT - JD vừa được xử lý ở nơi khác (@Version)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/jobs/{id}/reject:
    post:
      tags: [staff-job]
      summary: Cán bộ trả lại JD (DN-07)
      description: Vai trò STAFF. Chỉ PENDING → REJECTED. Lý do bắt buộc (cắt khoảng trắng, 1-1000 ký tự), lưu vào rejectReason (HR thấy trên form DN-02 và gửi duyệt lại được) và lịch sử REJECT_JD.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
            example: { reason: Mô tả công việc còn sơ sài, bổ sung phần quyền lợi }
      responses:
        '200':
          description: JD đã REJECTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffJobDetail' }
        '400':
          description: 'VALIDATION_ERROR - errors.reason "Vui lòng nhập lý do" (thiếu, rỗng, chỉ khoảng trắng) hoặc "Lý do tối đa 1000 ký tự"; BAD_REQUEST - id không phải UUID, JSON hỏng'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED - thiếu hoặc sai token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải STAFF) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có JD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: INVALID_JOB_STATUS - JD không ở PENDING; CONFLICT - JD vừa được xử lý ở nơi khác
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/jobs/{id}/close:
    post:
      tags: [staff-job]
      summary: Cán bộ đóng JD đang tuyển (DN-07)
      description: Vai trò STAFF. Chỉ APPROVED → CLOSED (đóng do vi phạm). Lý do bắt buộc như trả lại, chỉ ghi vào lịch sử CLOSE_JD; rejectReason không đổi.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: JD đã CLOSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffJobDetail' }
        '400':
          description: VALIDATION_ERROR - errors.reason (thiếu, chỉ khoảng trắng, quá 1000 ký tự); BAD_REQUEST - id không phải UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED - thiếu hoặc sai token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải STAFF) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có JD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: INVALID_JOB_STATUS - JD không ở APPROVED; CONFLICT - JD vừa được xử lý ở nơi khác
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/hr-accounts/{userId}/lock:
    post:
      tags: [staff]
      summary: Cán bộ khoá tài khoản HR
      description: Vai trò STAFF. Khoá ở identity-service rồi chép locked_at về company-service. Lý do bắt buộc (sau khi cắt khoảng trắng), tối đa 500 ký tự. Khoá lại tài khoản đã khoá vẫn trả 200. HR bị khoá nhận 401 ACCOUNT_DISABLED ở identity và company-service (các service khác chưa chặn), và 403 ACCOUNT_DISABLED khi đăng nhập.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LockHrAccountRequest' }
      responses:
        '200':
          description: Tài khoản HR sau khi khoá
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffHrAccount' }
        '400':
          description: VALIDATION_ERROR - lý do trống hoặc quá 500 ký tự (errors.reason)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED - thiếu hoặc sai token, hoặc ACCOUNT_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải STAFF) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - userId không phải tài khoản HR của công ty nào
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: EXTERNAL_UNAVAILABLE - không kết nối được identity-service, trạng thái không đổi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/hr-accounts/{userId}/unlock:
    post:
      tags: [staff]
      summary: Cán bộ mở khoá tài khoản HR
      description: Vai trò STAFF. Mở khoá ở identity-service (xoá lý do, thời điểm khoá, khoá tạm và bộ đếm sai mật khẩu) rồi xoá bản sao ở company-service. Tài khoản không bị cán bộ khoá thì không đổi gì và vẫn trả 200.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tài khoản HR sau khi mở khoá
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffHrAccount' }
        '401':
          description: UNAUTHORIZED - thiếu hoặc sai token, hoặc ACCOUNT_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải STAFF) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - userId không phải tài khoản HR của công ty nào
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: EXTERNAL_UNAVAILABLE - không kết nối được identity-service
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /companies/me:
    get:
      tags: [company]
      summary: HR xem hồ sơ công ty của mình
      description: Công ty được xác định từ userId trong JWT qua bảng company_hr, không đọc claim companyId.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyResponse' }
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải HR) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - HR chưa được gán công ty nào
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [company]
      summary: HR sửa hồ sơ công ty của mình
      description: |
        Chỉ sửa được name, industry, size, address, city, website, description. Body không có id, taxCode, status, logoUrl; trường lạ trong body bị bỏ qua
        (ví dụ gửi kèm id của công ty khác thì vẫn chỉ công ty của chính HR được sửa). Gửi chuỗi rỗng hoặc null để xoá một trường tuỳ chọn.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCompanyRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyResponse' }
        '400':
          description: VALIDATION_ERROR - errors là map field -> thông báo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải HR), MUST_CHANGE_PASSWORD hoặc COMPANY_LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - HR chưa được gán công ty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: UNSUPPORTED_MEDIA_TYPE - Content-Type không phải application/json
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /companies/{id}:
    put:
      tags: [company]
      summary: HR sửa công ty theo id (chỉ công ty của mình)
      description: |
        Công ty của HR xác định qua bảng company_hr, không đọc claim companyId. id là công ty của HR thì xử lý y như PUT /companies/me.
        id là công ty khác hoặc không tồn tại thì trả cùng một lỗi 404, không lộ id có thật. Cán bộ quản lý công ty qua /staff/companies.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCompanyRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyResponse' }
        '400':
          description: VALIDATION_ERROR - errors là map field -> thông báo; BAD_REQUEST - id không phải UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED hoặc ACCOUNT_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải HR), MUST_CHANGE_PASSWORD hoặc COMPANY_LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có công ty, hoặc không phải công ty của HR đang gọi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /companies/me/logo:
    post:
      tags: [company]
      summary: HR tải logo công ty
      description: |
        multipart/form-data, phần tên `file`. Chỉ nhận JPG (FF D8 FF) hoặc PNG (89 50 4E 47 0D 0A 1A 0A), kiểm tra theo nội dung tệp chứ không theo đuôi hay Content-Type.
        Tối đa 2 MB (2 * 1024 * 1024 byte). Logo cũ bị xoá sau khi logo mới đã lưu.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: OK - logoUrl trỏ tới /companies/logos/{fileName}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyResponse' }
        '400':
          description: FILE_TOO_LARGE (quá 2 MB, kể cả khi vượt giới hạn multipart 3 MB), INVALID_FILE_TYPE (không phải JPG/PNG, hoặc tệp rỗng) hoặc VALIDATION_ERROR (thiếu phần `file`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải HR), MUST_CHANGE_PASSWORD hoặc COMPANY_LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - HR chưa được gán công ty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: UNSUPPORTED_MEDIA_TYPE - không phải multipart/form-data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /companies/logos/{fileName}:
    get:
      tags: [company]
      summary: Tải ảnh logo (công khai, không cần token)
      description: Để thẻ img của trình duyệt dùng được. fileName có dạng `<uuid>.jpg` hoặc `<uuid>.png`; tên khác dạng này luôn trả 404. Có Cache-Control public, max-age 1 ngày.
      security: []
      parameters:
        - { name: fileName, in: path, required: true, schema: { type: string, example: 3f6f0a1e-0000-4000-8000-000000000000.png } }
      responses:
        '200':
          description: Ảnh logo
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '404':
          description: NOT_FOUND - không có tệp, hoặc tên tệp sai dạng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /companies/me/jobs:
    get:
      tags: [job]
      summary: HR xem danh sách JD của công ty mình
      description: Vai trò HR. Lọc theo trạng thái JD (tuỳ chọn). Sắp updatedAt giảm dần rồi id. page từ 1, size tối đa 100. HR của công ty LOCKED nhận 401 ACCOUNT_DISABLED (DN-07).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/JobStatus' } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Trang JD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobSummaryPage' }
        '400':
          description: BAD_REQUEST - page/size ngoài khoảng hoặc status không phải một trong 5 giá trị
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED - thiếu hoặc sai token; ACCOUNT_DISABLED - HR bị cán bộ khoá hoặc công ty của HR đang bị khoá
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải HR) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - HR chưa được gán công ty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /companies/me/jobs/summary:
    get:
      tags: [job]
      summary: HR xem tổng hợp JD của công ty mình
      description: Vai trò HR. Số JD theo từng trạng thái (byStatus luôn đủ 5 khoá, theo thứ tự enum) và expiringSoon = số JD APPROVED có deadline từ hôm nay đến hôm nay + 7 ngày (Asia/Ho_Chi_Minh). HR của công ty LOCKED nhận 401 ACCOUNT_DISABLED (DN-07).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Tổng hợp JD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatusSummary' }
              example: { total: 11, byStatus: { DRAFT: 3, PENDING: 5, APPROVED: 2, REJECTED: 1, CLOSED: 0 }, expiringSoon: 1 }
        '401':
          description: UNAUTHORIZED - thiếu hoặc sai token; ACCOUNT_DISABLED - HR bị cán bộ khoá hoặc công ty của HR đang bị khoá
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải HR) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - HR chưa được gán công ty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /companies/me/jobs/{id}:
    get:
      tags: [job]
      summary: HR xem chi tiết JD của công ty mình
      description: Vai trò HR. Trước DN-07 là GET /jobs/{id} (đường đó nay là chi tiết công khai); cùng quyền, cùng hành vi, cùng JobResponse. Chỉ JD của công ty mình, mọi trạng thái.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Chi tiết JD kèm kỹ năng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '400':
          description: BAD_REQUEST - id không phải UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED; ACCOUNT_DISABLED - HR bị cán bộ khoá hoặc công ty của HR đang bị khoá
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải HR) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có JD, hoặc JD của công ty khác (cùng một lỗi)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /jobs:
    get:
      tags: [public-job]
      summary: Trang việc làm - danh sách JD đang tuyển (công khai, DN-07)
      description: |
        Không cần đăng nhập; token thiếu hoặc sai vẫn 200. Token hợp lệ vẫn đi qua bộ lọc chung (token mustChangePassword → 403, HR của công ty
        bị khoá → 401). Chỉ JD hiện với ứng viên (APPROVED, deadline >= hôm nay giờ Việt Nam, công ty ACTIVE). Sắp publishedAt giảm dần
        (COALESCE(reviewed_at, updated_at)) rồi id. page từ 1, size tối đa 100 (trang ứng viên gọi size=100).
      security: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Trang JD đang tuyển
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicJobPage' }
        '400':
          description: BAD_REQUEST - page/size ngoài khoảng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [job]
      summary: HR tạo JD
      description: |
        Vai trò HR. Tạo JD nháp (status DRAFT) cho công ty của HR; companyId lấy từ company_hr, createdBy là userId của token.
        Body không quyết định companyId, status, createdBy, reviewed*, rejectReason (trường lạ bị bỏ qua). Lưu nháp chỉ bắt buộc title;
        trường nào có giá trị thì phải đúng (quantity >= 1, lương >= 0, salaryMin <= salaryMax, deadline >= hôm nay theo Asia/Ho_Chi_Minh).
        Có skills thì company-service gọi GET ${PROFILE_SERVICE_URL}/skills (chuyển tiếp Authorization của HR) để kiểm danh mục trước khi ghi.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobRequest' }
      responses:
        '201':
          description: JD vừa tạo (DRAFT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '400':
          description: 'VALIDATION_ERROR - errors theo field (title, deadline, salaryMax, quantity, skills, "skills[i].minScore"...); BAD_REQUEST - JSON hỏng hoặc enum sai giá trị (không có errors)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED - thiếu hoặc sai token; ACCOUNT_DISABLED - HR bị cán bộ khoá hoặc công ty của HR đang bị khoá
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải HR), MUST_CHANGE_PASSWORD hoặc COMPANY_LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - HR chưa được gán công ty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: EXTERNAL_UNAVAILABLE - "Không kiểm tra được danh mục kỹ năng, vui lòng thử lại." (profile-service tắt, timeout 5 giây hoặc lỗi); không có gì được ghi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /jobs/{id}:
    get:
      tags: [public-job]
      summary: Trang việc làm - chi tiết JD (công khai, DN-07)
      description: |
        Không cần đăng nhập. Chỉ JD hiện với ứng viên; JD chờ duyệt, nháp, bị trả lại, đã đóng, quá hạn, của công ty bị khoá hoặc id không tồn tại
        đều trả cùng một 404. Không có status, rejectReason, reviewedBy, createdBy. Kỹ năng chỉ có skillId (ghép tên với GET /skills).
        Chi tiết JD của HR chuyển sang GET /companies/me/jobs/{id} (DN-07).
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Chi tiết JD kèm kỹ năng và thông tin công ty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicJobDetail' }
        '400':
          description: BAD_REQUEST - id không phải UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 'NOT_FOUND - "Không tìm thấy JD" (JD không hiện với ứng viên hoặc không tồn tại)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [job]
      summary: HR sửa JD
      description: |
        Vai trò HR. Thay toàn bộ thông tin chung (field không gửi hoặc null bị xoá, trừ title). skills có mặt (kể cả mảng rỗng) thì thay luôn
        danh sách kỹ năng trong cùng transaction; skills vắng mặt thì giữ nguyên kỹ năng. Sửa được khi DRAFT (giữ DRAFT), REJECTED (giữ REJECTED)
        và APPROVED: JD APPROVED phải qua đủ kiểm tra gửi duyệt rồi chuyển về PENDING (không đạt → 400, JD vẫn APPROVED).
        PENDING và CLOSED không sửa được (409 JOB_NOT_EDITABLE).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobRequest' }
      responses:
        '200':
          description: JD sau khi sửa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '400':
          description: VALIDATION_ERROR - dữ liệu sai, hoặc JD APPROVED không đủ điều kiện gửi duyệt lại (errors theo field); BAD_REQUEST - JSON hỏng, enum sai, id không phải UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED; ACCOUNT_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải HR), MUST_CHANGE_PASSWORD hoặc COMPANY_LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có JD hoặc JD của công ty khác
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: JOB_NOT_EDITABLE - JD đang PENDING hoặc CLOSED; CONFLICT - JD vừa được lưu ở nơi khác (khoá lạc quan)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: EXTERNAL_UNAVAILABLE - không kiểm tra được danh mục kỹ năng (chỉ khi body có skills); JD không đổi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /jobs/{id}/skills:
    put:
      tags: [job]
      summary: HR thay kỹ năng yêu cầu của JD
      description: |
        Vai trò HR. Body là mảng [{skillId, required, minScore}], thay toàn bộ danh sách: tối đa 20, không trùng skillId, minScore nguyên 1-100,
        required không null, mọi skillId có trong danh mục GET /skills của profile-service. Mảng rỗng = xoá hết. Cùng quy tắc trạng thái như PUT /jobs/{id}
        (APPROVED → PENDING sau khi qua kiểm tra gửi duyệt). Frontend DN-02 không gọi endpoint này (lưu một lần bằng PUT /jobs/{id} kèm skills).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 20
              items: { $ref: '#/components/schemas/JobSkill' }
      responses:
        '200':
          description: JD sau khi thay kỹ năng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '400':
          description: VALIDATION_ERROR - errors.skills (sai cấu trúc, trùng, minScore ngoài 1-100, ngoài danh mục) hoặc JD APPROVED không đủ điều kiện gửi duyệt lại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED; ACCOUNT_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải HR), MUST_CHANGE_PASSWORD hoặc COMPANY_LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có JD hoặc JD của công ty khác (kỹ năng không đổi, danh mục không bị gọi)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: JOB_NOT_EDITABLE - JD đang PENDING hoặc CLOSED; CONFLICT - JD vừa được lưu ở nơi khác
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: EXTERNAL_UNAVAILABLE - không kiểm tra được danh mục kỹ năng; JD không đổi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /jobs/{id}/submit:
    post:
      tags: [job]
      summary: HR gửi duyệt JD
      description: |
        Vai trò HR. Không có body. Chỉ từ DRAFT hoặc REJECTED (xoá rejectReason) → PENDING. Kiểm trên dữ liệu đã lưu: đủ title, position, level, type,
        quantity, city, workMode, deadline, description; deadline >= hôm nay theo Asia/Ho_Chi_Minh; salaryMin <= salaryMax; có ít nhất một kỹ năng
        required = true. errors liệt kê mọi điều kiện sai cùng lúc (khoá skills cho điều kiện kỹ năng bắt buộc).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: JD đã chuyển PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '400':
          description: 'VALIDATION_ERROR - ví dụ errors = { "skills": "Cần ít nhất một kỹ năng bắt buộc", "deadline": "Không được để trống" }; BAD_REQUEST - id không phải UUID'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED; ACCOUNT_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải HR), MUST_CHANGE_PASSWORD hoặc COMPANY_LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có JD hoặc JD của công ty khác
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: INVALID_JOB_STATUS - JD không ở DRAFT/REJECTED (ví dụ bấm gửi duyệt lần hai); CONFLICT - JD vừa được lưu ở nơi khác
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /jobs/{id}/close:
    post:
      tags: [job]
      summary: HR đóng JD
      description: Vai trò HR. Không có body. Chỉ APPROVED → CLOSED. JD đã đóng không sửa, không gửi duyệt được.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: JD đã chuyển CLOSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '400':
          description: BAD_REQUEST - id không phải UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHORIZED; ACCOUNT_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải HR), MUST_CHANGE_PASSWORD hoặc COMPANY_LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có JD hoặc JD của công ty khác
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: INVALID_JOB_STATUS - JD không ở APPROVED; CONFLICT - JD vừa được lưu ở nơi khác
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /jobs/{id}/match/me:
    get:
      tags: [match]
      summary: Ứng viên xem điểm khớp của mình với một JD
      description: |
        Vai trò CANDIDATE. Chỉ JD APPROVED (JD khác trả 404, không lộ JD chưa công bố). Công thức ở docs/matching.md. Kỹ năng chỉ tự khai không được cộng điểm;
        chưa có điểm xác minh thì candidateScore = 0. Mỗi lần gọi lấy verified_score hiện tại của ứng viên (profile-service), đổi min_score hoặc điểm kỹ năng
        thì ra điểm mới, không trả bản đệm cũ. Hợp đồng đúng như UT-02 (ut02-openapi.yaml Match/MatchSkill).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Điểm khớp và giải thích
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchResponse' }
        '401':
          description: UNAUTHORIZED; ACCOUNT_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải CANDIDATE) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có JD hoặc JD chưa APPROVED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: EXTERNAL_UNAVAILABLE - profile-service hoặc danh mục kỹ năng không trả lời
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /jobs/{id}/match/{userId}:
    get:
      tags: [match]
      summary: HR hoặc STAFF xem điểm khớp của một ứng viên với JD
      description: |
        Vai trò HR hoặc STAFF. HR: JD phải thuộc công ty của HR và userId phải có đơn ứng tuyển vào JD này (mọi trạng thái, kể cả REJECTED, WITHDRAWN);
        không thoả thì 404 NOT_FOUND "Không tìm thấy JD", giống JD không tồn tại. STAFF: mọi JD (kể cả DRAFT), mọi ứng viên, không kiểm tra đơn ứng tuyển.
        Đây là endpoint recruitment-service (UT-02, HttpJobMatchClient) gọi sẵn; hợp đồng không đổi.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Điểm khớp và giải thích
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchResponse' }
        '401':
          description: UNAUTHORIZED; ACCOUNT_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: FORBIDDEN (không phải HR hoặc STAFF) hoặc MUST_CHANGE_PASSWORD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có JD, JD của công ty khác, hoặc (HR) ứng viên chưa ứng tuyển JD này
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: EXTERNAL_UNAVAILABLE - profile-service, recruitment-service hoặc danh mục kỹ năng không trả lời
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /internal/jobs/{jobId}/application-context:
    get:
      tags: [internal]
      summary: Ngữ cảnh JD cho nộp hồ sơ (recruitment-service, UT-01)
      description: |
        KHÔNG qua gateway: gateway không có route /internal/**, chỉ gọi thẳng company-service (http://localhost:8085). Không dùng JWT; bảo vệ bằng
        header X-Internal-Key so (hằng thời gian) với INTERNAL_SERVICE_KEY, khoá cấu hình rỗng thì từ chối tất cả. Hợp đồng đúng như UT-01
        (record JobApplicationContext, ut01-dependencies-openapi.yaml). deadline là 00:00 ngày kế tiếp ngày hạn nộp theo Asia/Ho_Chi_Minh
        (JD hạn 31/12 nhận hồ sơ hết ngày 31/12); JD chưa có deadline (chỉ DRAFT) trả deadline = createdAt. hrEmails là email của HR công ty chưa
        bị khoá (company_hr.locked_at null) và đang ACTIVE ở identity, tra theo lô qua POST /internal/users/lookup; không có HR thì mảng rỗng.
        Không ghi job_views.
      servers:
        - url: http://localhost:8085
          description: Gọi thẳng company-service (không qua gateway)
      security: [{ internalKey: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ngữ cảnh JD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobApplicationContext' }
        '400':
          description: BAD_REQUEST - jobId không phải UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: INVALID_SERVICE_KEY - thiếu hoặc sai X-Internal-Key (JWT hợp lệ không thay được khoá)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND - không có JD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: EXTERNAL_UNAVAILABLE - không tra được email HR ở identity-service
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT do identity-service cấp (xem identity-openapi.yaml). STAFF đăng nhập qua SSO LMS, HR đăng nhập bằng email/mật khẩu. Token còn mustChangePassword bị mọi endpoint ở đây từ chối với 403 MUST_CHANGE_PASSWORD. Token của HR bị khoá riêng hoặc thuộc công ty LOCKED bị HrLockedFilter từ chối 401 ACCOUNT_DISABLED trên mọi endpoint (DN-07, HR của công ty bị khoá mất cả quyền đọc).
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: Khoá dịch vụ nội bộ INTERNAL_SERVICE_KEY (mặc định dev-internal-key), chỉ cho /internal/**. Không bao giờ đưa ra frontend.
  schemas:
    CompanyStatus:
      type: string
      enum: [ACTIVE, LOCKED]
    CreateCompanyRequest:
      type: object
      required: [name, taxCode]
      properties:
        name: { type: string, maxLength: 255 }
        taxCode: { type: string, pattern: '^(\d{10}|\d{13})$', description: '10 hoặc 13 chữ số, duy nhất toàn hệ thống', example: '0312345678' }
        industry: { type: string, maxLength: 100, nullable: true }
        size: { type: string, enum: ['1-50', '51-200', '201-1000', '1000+', ''], nullable: true, description: Chuỗi rỗng được coi là không có }
        address: { type: string, maxLength: 255, nullable: true }
        city: { type: string, maxLength: 100, nullable: true }
        website: { type: string, maxLength: 255, nullable: true, description: Rỗng hoặc bắt đầu bằng http:// hoặc https://, example: 'https://example.com' }
        description: { type: string, nullable: true }
    UpdateCompanyRequest:
      type: object
      required: [name]
      description: Không có id, taxCode, status, logoUrl - các trường này không sửa được qua API HR.
      properties:
        name: { type: string, maxLength: 255 }
        industry: { type: string, maxLength: 100, nullable: true }
        size: { type: string, enum: ['1-50', '51-200', '201-1000', '1000+', ''], nullable: true }
        address: { type: string, maxLength: 255, nullable: true }
        city: { type: string, maxLength: 100, nullable: true }
        website: { type: string, maxLength: 255, nullable: true, description: Rỗng hoặc bắt đầu bằng http:// hoặc https:// }
        description: { type: string, nullable: true }
    CompanyResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        taxCode: { type: string }
        industry: { type: string, nullable: true }
        size: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        website: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true, description: 'Đường dẫn tương đối, ví dụ /companies/logos/<uuid>.png. Ghép sau tiền tố /api/v1 khi hiển thị.' }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/CompanyStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateHrAccountRequest:
      type: object
      required: [email, fullName]
      properties:
        email: { type: string, format: email, maxLength: 255, description: Được cắt khoảng trắng và chuyển chữ thường }
        fullName: { type: string, maxLength: 255 }
    HrAccountResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string }
        companyId: { type: string, format: uuid }
    StaffCompanyItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        taxCode: { type: string }
        status: { $ref: '#/components/schemas/CompanyStatus' }
        hrCount: { type: integer, format: int64 }
        jdCount: { type: integer, format: int64, description: 'Số JD của công ty, mọi trạng thái trừ DRAFT (DN-02)' }
        createdAt: { type: string, format: date-time }
        logoUrl: { type: string, nullable: true }
        city: { type: string, nullable: true }
        size: { type: string, nullable: true }
    StaffCompanyPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffCompanyItem' } }
        total: { type: integer, format: int64 }
        page: { type: integer, description: Bắt đầu từ 1 }
        size: { type: integer }
    StaffHrAccount:
      type: object
      description: status chỉ nói về khoá riêng - LOCKED khi cán bộ khoá riêng HR này (lockedAt khác null), ngược lại ACTIVE. companyLocked (DN-07) là cờ khoá theo công ty, độc lập với status. tempLockedUntil chỉ có khi đang khoá tạm do sai mật khẩu còn hạn.
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string }
        status: { type: string, enum: [ACTIVE, LOCKED] }
        lockedReason: { type: string, nullable: true }
        lockedAt: { type: string, format: date-time, nullable: true }
        tempLockedUntil: { type: string, format: date-time, nullable: true }
        companyLocked: { type: boolean, description: 'true khi HR đang bị khoá theo công ty (công ty LOCKED, DN-07)' }
    StaffCompanyDetail:
      description: Mọi field của CompanyResponse cộng hrAccounts và lock (DN-07).
      allOf:
        - { $ref: '#/components/schemas/CompanyResponse' }
        - type: object
          properties:
            hrAccounts: { type: array, items: { $ref: '#/components/schemas/StaffHrAccount' } }
            lock:
              allOf: [{ $ref: '#/components/schemas/CompanyLockInfo' }]
              nullable: true
              description: null khi công ty ACTIVE (hoặc LOCKED từ dữ liệu cũ chưa có dòng LOCK trong lịch sử)
    CompanyLockInfo:
      type: object
      description: Lấy từ dòng LOCK mới nhất của company_actions (cho banner).
      properties:
        lockedAt: { type: string, format: date-time }
        reason: { type: string }
        lockedBy: { $ref: '#/components/schemas/StaffRef' }
    StaffRef:
      type: object
      properties:
        id: { type: string, format: uuid, description: userId của cán bộ }
        fullName: { type: string, nullable: true, description: null khi không tra được identity-service }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000, description: 'Bắt buộc; tính sau khi cắt khoảng trắng hai đầu, chỉ có khoảng trắng coi như thiếu' }
    CompanyActionType:
      type: string
      enum: [LOCK, UNLOCK, APPROVE_JD, REJECT_JD, CLOSE_JD]
    CompanyActionItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        action: { $ref: '#/components/schemas/CompanyActionType' }
        createdAt: { type: string, format: date-time }
        reason: { type: string, nullable: true, description: 'Có với LOCK, REJECT_JD, CLOSE_JD' }
        staff: { $ref: '#/components/schemas/StaffRef' }
        job:
          type: object
          nullable: true
          description: null với LOCK/UNLOCK
          properties:
            id: { type: string, format: uuid }
            title: { type: string, nullable: true, description: null khi JD không còn }
    CompanyActionPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CompanyActionItem' } }
        total: { type: integer, format: int64 }
        page: { type: integer, description: Bắt đầu từ 1 }
        size: { type: integer }
    LockHrAccountRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, description: "Bắt buộc, không rỗng sau khi cắt khoảng trắng" }
    JobStatus:
      type: string
      enum: [DRAFT, PENDING, APPROVED, REJECTED, CLOSED]
      description: 'DRAFT Nháp, PENDING Chờ duyệt, APPROVED Đang tuyển, REJECTED Bị trả lại, CLOSED Đã đóng. Cán bộ duyệt / trả lại / đóng ở /staff/jobs/** (DN-07); JD APPROVED quá hạn được tự đóng lúc 00:05 hằng ngày (giờ Việt Nam).'
    JobLevel:
      type: string
      enum: [INTERN, FRESHER, JUNIOR, MIDDLE, SENIOR]
    JobType:
      type: string
      enum: [FULLTIME, PARTTIME, INTERNSHIP]
    WorkMode:
      type: string
      enum: [ONSITE, REMOTE, HYBRID]
    JobSkill:
      type: object
      required: [skillId, required, minScore]
      properties:
        skillId: { type: string, format: uuid, description: 'id trong danh mục GET /skills của profile-service (không có khoá ngoại chéo schema)' }
        required: { type: boolean, description: 'true = bắt buộc (thiếu là không đạt), false = ưu tiên (có thì cộng điểm)' }
        minScore: { type: integer, minimum: 1, maximum: 100, description: 'Mức tối thiểu trên thang 100; bậc hiển thị <40 Cơ bản, <70 Khá, <85 Tốt, còn lại Xuất sắc' }
    JobRequest:
      type: object
      required: [title]
      description: Không có id, companyId, status, createdBy, reviewedBy/At, rejectReason; trường lạ bị bỏ qua. Chuỗi rỗng hoặc chỉ có khoảng trắng ở trường tuỳ chọn được lưu thành null.
      properties:
        title: { type: string, maxLength: 255, description: 'Bắt buộc, không rỗng sau khi cắt khoảng trắng', example: 'Junior Backend Developer (Java/Spring Boot)' }
        position: { type: string, maxLength: 255, nullable: true, example: Backend Developer }
        level: { allOf: [{ $ref: '#/components/schemas/JobLevel' }], nullable: true }
        type: { allOf: [{ $ref: '#/components/schemas/JobType' }], nullable: true }
        quantity: { type: integer, minimum: 1, maximum: 2147483647, nullable: true }
        city: { type: string, maxLength: 100, nullable: true }
        address: { type: string, maxLength: 255, nullable: true }
        workMode: { allOf: [{ $ref: '#/components/schemas/WorkMode' }], nullable: true }
        salaryMin: { type: integer, format: int64, minimum: 0, nullable: true, description: VND }
        salaryMax: { type: integer, format: int64, minimum: 0, nullable: true, description: 'VND; khi có cả hai thì salaryMin <= salaryMax (lỗi ở errors.salaryMax)' }
        description: { type: string, nullable: true }
        requirements: { type: string, nullable: true, description: 'Yêu cầu khác (văn bản tự do, hệ thống không so khớp), ví dụ tiếng Nhật N3' }
        benefits: { type: string, nullable: true }
        deadline: { type: string, format: date, nullable: true, description: 'yyyy-MM-dd, ngày cuối nhận hồ sơ; >= hôm nay theo Asia/Ho_Chi_Minh, kiểm cả khi lưu nháp' }
        skills:
          type: array
          nullable: true
          maxItems: 20
          description: 'Vắng mặt (null) = giữ nguyên kỹ năng; có mặt (kể cả []) = thay toàn bộ trong cùng transaction với thông tin chung'
          items: { $ref: '#/components/schemas/JobSkill' }
    JobResponse:
      type: object
      description: Mọi cột của jobs trừ created_by, version. Backend không trả tên kỹ năng; frontend ghép với danh mục GET /skills.
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        title: { type: string }
        position: { type: string, nullable: true }
        level: { allOf: [{ $ref: '#/components/schemas/JobLevel' }], nullable: true }
        type: { allOf: [{ $ref: '#/components/schemas/JobType' }], nullable: true }
        quantity: { type: integer, nullable: true }
        city: { type: string, nullable: true }
        address: { type: string, nullable: true }
        workMode: { allOf: [{ $ref: '#/components/schemas/WorkMode' }], nullable: true }
        salaryMin: { type: integer, format: int64, nullable: true }
        salaryMax: { type: integer, format: int64, nullable: true }
        description: { type: string, nullable: true }
        requirements: { type: string, nullable: true }
        benefits: { type: string, nullable: true }
        deadline: { type: string, format: date, nullable: true }
        status: { $ref: '#/components/schemas/JobStatus' }
        rejectReason: { type: string, nullable: true, description: Chỉ khác null khi status = REJECTED }
        reviewedAt: { type: string, format: date-time, nullable: true, description: 'Lần cán bộ xử lý gần nhất (DN-07)' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        skills:
          type: array
          description: Sắp required trước, rồi minScore giảm dần
          items: { $ref: '#/components/schemas/JobSkill' }
    JobSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        level: { allOf: [{ $ref: '#/components/schemas/JobLevel' }], nullable: true }
        status: { $ref: '#/components/schemas/JobStatus' }
        deadline: { type: string, format: date, nullable: true }
        updatedAt: { type: string, format: date-time }
        requiredSkillCount: { type: integer, description: Số kỹ năng bắt buộc của JD }
        rejectReason: { type: string, nullable: true, description: Chỉ có khi status là REJECTED }
    JobStatusSummary:
      type: object
      properties:
        total: { type: integer, format: int64 }
        byStatus:
          type: object
          description: Đủ 5 khoá trạng thái, giá trị 0 vẫn có mặt
          properties:
            DRAFT: { type: integer, format: int64 }
            PENDING: { type: integer, format: int64 }
            APPROVED: { type: integer, format: int64 }
            REJECTED: { type: integer, format: int64 }
            CLOSED: { type: integer, format: int64 }
        expiringSoon: { type: integer, format: int64, description: Số JD APPROVED hết hạn trong 7 ngày tới }
    JobSummaryPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JobSummary' } }
        total: { type: integer, format: int64 }
        page: { type: integer, description: Bắt đầu từ 1 }
        size: { type: integer }
    PublicCompanyRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        logoUrl: { type: string, nullable: true }
    PublicCompanyInfo:
      type: object
      description: Chỉ thông tin giới thiệu; không có taxCode, status.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        logoUrl: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        size: { type: string, nullable: true }
        city: { type: string, nullable: true }
        website: { type: string, nullable: true }
        description: { type: string, nullable: true }
    PublicJobSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        level: { allOf: [{ $ref: '#/components/schemas/JobLevel' }], nullable: true }
        type: { allOf: [{ $ref: '#/components/schemas/JobType' }], nullable: true }
        workMode: { allOf: [{ $ref: '#/components/schemas/WorkMode' }], nullable: true }
        city: { type: string, nullable: true }
        salaryMin: { type: integer, format: int64, nullable: true }
        salaryMax: { type: integer, format: int64, nullable: true }
        deadline: { type: string, format: date }
        publishedAt: { type: string, format: date-time, description: 'reviewedAt, thiếu thì updatedAt' }
        company: { $ref: '#/components/schemas/PublicCompanyRef' }
    PublicJobPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PublicJobSummary' } }
        total: { type: integer, format: int64 }
        page: { type: integer, description: Bắt đầu từ 1 }
        size: { type: integer }
    PublicJobDetail:
      type: object
      description: Không có status, rejectReason, reviewedBy, createdBy.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        position: { type: string, nullable: true }
        level: { allOf: [{ $ref: '#/components/schemas/JobLevel' }], nullable: true }
        type: { allOf: [{ $ref: '#/components/schemas/JobType' }], nullable: true }
        workMode: { allOf: [{ $ref: '#/components/schemas/WorkMode' }], nullable: true }
        quantity: { type: integer, nullable: true }
        city: { type: string, nullable: true }
        address: { type: string, nullable: true }
        salaryMin: { type: integer, format: int64, nullable: true }
        salaryMax: { type: integer, format: int64, nullable: true }
        deadline: { type: string, format: date, nullable: true }
        publishedAt: { type: string, format: date-time }
        description: { type: string, nullable: true }
        requirements: { type: string, nullable: true }
        benefits: { type: string, nullable: true }
        skills:
          type: array
          description: Sắp required trước, rồi minScore giảm dần; không có tên kỹ năng
          items: { $ref: '#/components/schemas/JobSkill' }
        company: { $ref: '#/components/schemas/PublicCompanyInfo' }
    StaffJobItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        deadline: { type: string, format: date, nullable: true }
        submittedAt: { type: string, format: date-time, description: 'updatedAt của JD (với PENDING là lúc gửi duyệt)' }
        company:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
    StaffJobPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffJobItem' } }
        total: { type: integer, format: int64 }
        page: { type: integer, description: Bắt đầu từ 1 }
        size: { type: integer }
    StaffJobDetail:
      type: object
      description: Nội dung JD (dạng ứng viên thấy, lồng trong job) cộng thông tin duyệt. publishedAt trong job vẫn tính như trang công khai dù JD chưa duyệt.
      properties:
        job: { $ref: '#/components/schemas/PublicJobDetail' }
        status: { $ref: '#/components/schemas/JobStatus' }
        rejectReason: { type: string, nullable: true, description: Chỉ khác null khi REJECTED }
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewedBy:
          allOf: [{ $ref: '#/components/schemas/StaffRef' }]
          nullable: true
          description: null khi JD chưa được cán bộ xử lý (kể cả JD seed và dữ liệu backfill)
        companyLocked: { type: boolean, description: 'Công ty của JD đang LOCKED (nhãn "Công ty đang bị khoá")' }
    MatchSkill:
      type: object
      required: [skill, required, minScore, candidateScore]
      properties:
        skill: { type: string, description: Tên kỹ năng trong danh mục (không còn trong danh mục thì là skillId) }
        required: { type: boolean }
        minScore: { type: number }
        candidateScore: { type: number, description: verified_score của ứng viên; 0 khi chưa có }
    MatchResponse:
      type: object
      description: Điểm khớp ứng viên với JD (DN-06), đúng hợp đồng Match của ut02-openapi.yaml. Công thức ở docs/matching.md.
      required: [score, belowMinimum, met, missing]
      properties:
        score: { type: number, minimum: 0, maximum: 100, description: "Số nguyên (làm tròn 0,5 lên)" }
        belowMinimum: { type: boolean, description: true khi có kỹ năng bắt buộc với điểm dưới 50% min_score }
        met: { type: array, items: { $ref: '#/components/schemas/MatchSkill' }, description: Kỹ năng đạt (điểm >= min_score) }
        missing: { type: array, items: { $ref: '#/components/schemas/MatchSkill' }, description: Kỹ năng thiếu (điểm < min_score) }
    JobApplicationContext:
      type: object
      description: Khớp record JobApplicationContext của recruitment-service (UT-01). recruitment tự chặn nộp hồ sơ khi status khác APPROVED, deadline không sau hiện tại hoặc companyLocked.
      properties:
        jobId: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        jobTitle: { type: string, example: Thực tập sinh Tester }
        companyName: { type: string, example: Công ty A }
        status: { $ref: '#/components/schemas/JobStatus' }
        deadline: { type: string, format: date-time, example: '2027-01-01T00:00:00+07:00', description: '00:00 ngày kế tiếp ngày hạn nộp, giờ Việt Nam; JD chưa có hạn nộp trả createdAt' }
        companyLocked: { type: boolean }
        hrEmails: { type: array, items: { type: string, format: email }, example: ['hr1@rikkeijobs.test'] }
    Error:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
          description: BAD_REQUEST, VALIDATION_ERROR, UNAUTHORIZED, ACCOUNT_DISABLED (401, HR bị cán bộ khoá hoặc công ty của HR LOCKED), INVALID_SERVICE_KEY (401, /internal/**), FORBIDDEN, MUST_CHANGE_PASSWORD, COMPANY_LOCKED (403, tạo HR cho công ty bị khoá; nhánh ghi của HR còn giữ làm lớp phòng thủ thứ hai), NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT, JOB_NOT_EDITABLE (409, sửa JD đang PENDING hoặc CLOSED), INVALID_JOB_STATUS (409, gửi duyệt, đóng, duyệt, trả lại sai trạng thái), JOB_EXPIRED (409, cán bộ duyệt JD đã quá hạn nộp), UNSUPPORTED_MEDIA_TYPE, FILE_TOO_LARGE, INVALID_FILE_TYPE, EXTERNAL_UNAVAILABLE, INTERNAL_ERROR
        message: { type: string }
        errors: { description: Map field -> thông báo khi VALIDATION_ERROR, type: object, additionalProperties: { type: string } }
