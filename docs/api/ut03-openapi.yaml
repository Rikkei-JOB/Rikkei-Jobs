openapi: 3.0.3
info:
  title: UT-03 Contact Privacy
  version: 1.0.0
  description: DN-03 ngoài phạm vi. Quyền từ đơn ứng tuyển giữ nguyên sau rút/từ chối;
    chỉ endpoint contact trả dữ liệu HR.
servers:
- url: http://localhost:8080/api/v1
security:
- bearerAuth: []
paths:
  /candidates/{userId}/contact-requests:
    post:
      summary: Xin mở liên hệ cho công ty hiện hành
      description: 'Vai trò: HR'
      tags:
      - HR
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactRequest'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Chưa đăng nhập hoặc HR bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sai vai trò hoặc CONTACT_LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy hồ sơ công khai/JD/yêu cầu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: CONTACT_REQUEST_PENDING / CONTACT_ALREADY_ACCESSIBLE / CONTACT_REQUEST_ALREADY_REVIEWED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lưu dữ liệu hoặc commit audit thất bại; không trả contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service phụ thuộc không sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
  /candidates/{userId}/contact-access:
    get:
      summary: Đọc trạng thái quyền, không trả contact và không ghi log
      description: 'Vai trò: HR'
      tags:
      - HR
