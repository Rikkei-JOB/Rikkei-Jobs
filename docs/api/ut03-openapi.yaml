  /staff/contact-access-logs:
    get:
      summary: Tra cứu từng lần xem liên hệ; UTC [from,to)
      description: 'Vai trò: STAFF'
      tags:
      - STAFF
      parameters:
      - name: companyId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: userId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: ISO-8601 có offset; inclusive
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: ISO-8601 có offset; exclusive
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
