components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    CreateRequest:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: Trim trước khi kiểm tra độ dài
      required:
      - jobId
      - reason
    RejectRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - reason
    Contact:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
      required:
      - email
      - phone
    ContactRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        companyName:
          type: string
          nullable: true
        userId:
          type: string
          format: uuid
        candidateName:
          type: string
          nullable: true
        jobId:
          type: string
          format: uuid
        reason:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
        rejectionReason:
          type: string
          nullable: true
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        reviewedBy:
          type: string
          format: uuid
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - companyId
      - companyName
      - userId
      - candidateName
      - jobId
      - reason
      - status
      - rejectionReason
      - createdBy
      - createdAt
      - reviewedBy
      - reviewedAt
    ContactAccess:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        canSeeContact:
          type: boolean
        via:
          type: string
          enum:
          - APPLICATION
          - APPROVED_REQUEST
          nullable: true
        requestStatus:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          nullable: true
        latestRequest:
          allOf:
          - $ref: '#/components/schemas/ContactRequest'
          nullable: true
      required:
      - userId
      - fullName
      - canSeeContact
      - via
      - requestStatus
      - latestRequest
    ContactLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        companyName:
          type: string
        hrId:
          type: string
          format: uuid
        hrName:
          type: string
          nullable: true
        userId:
          type: string
          format: uuid
        candidateName:
          type: string
          nullable: true
        via:
          type: string
          enum:
          - APPLICATION
          - APPROVED_REQUEST
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - companyId
      - companyName
      - hrId
      - hrName
      - userId
      - candidateName
      - via
      - createdAt
    RequestPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContactRequest'
        total:
          type: integer
          format: int64
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
      required:
      - items
      - total
      - page
      - size
    LogPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContactLog'
        total:
          type: integer
          format: int64
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
      required:
      - items
      - total
      - page
      - size
