server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Both the gateway and identity-service answer CORS; keep one value or the browser rejects the response.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${WEB_BASE_URL:http://localhost:3000}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: [Authorization, Content-Type]
      # The browser calls /api/v1/<area>/... (docs/conventions.md); StripPrefix=2 removes "/api/v1" so the service sees /<area>/...
      routes:
        - id: identity-auth
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates: [Path=/api/v1/auth/**]
          filters: [StripPrefix=2]
        - id: profile
          uri: ${PROFILE_SERVICE_URL:http://localhost:8082}
          predicates: ["Path=/api/v1/profile/**,/api/v1/profiles/**"]
          filters: [StripPrefix=2]
        - id: recruitment
          uri: ${RECRUITMENT_SERVICE_URL:http://localhost:8083}
          predicates: [Path=/api/v1/recruitment/**]
          filters: [StripPrefix=2]
        - id: learning
          uri: ${LEARNING_SERVICE_URL:http://localhost:8084}
          predicates: [Path=/api/v1/learning/**]
          filters: [StripPrefix=2]
        - id: company
          uri: ${COMPANY_SERVICE_URL:http://localhost:8085}
          predicates: [Path=/api/v1/company/**]
          filters: [StripPrefix=2]
        - id: internship
          uri: ${INTERNSHIP_SERVICE_URL:http://localhost:8086}
          predicates: [Path=/api/v1/internship/**]
          filters: [StripPrefix=2]
        - id: assessment
          uri: ${ASSESSMENT_SERVICE_URL:http://localhost:8087}
          predicates: [Path=/api/v1/assessment/**]
          filters: [StripPrefix=2]
        - id: ai
          uri: ${AI_SERVICE_URL:http://localhost:8088}
          predicates: [Path=/api/v1/ai/**]
          filters: [StripPrefix=2]

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

# Swagger UI for every service: http://localhost:8080/api/docs
# Each service publishes its own OpenAPI JSON at /<area>/api-docs, reached here through the normal /api/v1 routes.
# A new service only needs a line below and springdoc.api-docs.path in its application.yml.
springdoc:
  api-docs:
    path: /api/docs/gateway-api-docs
  swagger-ui:
    path: /api/docs
    persist-authorization: true
    urls-primary-name: identity-service
    urls:
      - { name: identity-service, url: /api/v1/auth/api-docs }
      - { name: company-service, url: /api/v1/company/api-docs }
      - { name: profile-service, url: /api/v1/profile/api-docs }
      - { name: recruitment-service, url: /api/v1/recruitment/api-docs }
      - { name: learning-service, url: /api/v1/learning/api-docs }
      - { name: internship-service, url: /api/v1/internship/api-docs }
      - { name: assessment-service, url: /api/v1/assessment/api-docs }
      - { name: ai-service, url: /api/v1/ai/api-docs }
