server:
  port: ${INTERNSHIP_SERVICE_PORT:8086}

spring:
  application:
    name: internship-service
  datasource:
    url: ${INTERNSHIP_DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rikkei_jobs}}
    username: ${INTERNSHIP_DB_USER:${POSTGRES_USER:postgres}}
    password: ${INTERNSHIP_DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

