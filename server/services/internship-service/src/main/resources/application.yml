server:
  port: ${INTERNSHIP_SERVICE_PORT:8086}

spring:
  application:
    name: internship-service
  datasource:
    url: ${INTERNSHIP_DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rikkei_jobs}}
    username: ${INTERNSHIP_DB_USER:${POSTGRES_USER:postgres}}
    password: ${INTERNSHIP_DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  jwt:
    # Must equal identity-service's JWT_SECRET: tokens are issued there and only verified here.
    secret: ${JWT_SECRET:your_super_secret_jwt_key_at_least_256_bits_long_rikkei_jobs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never


# OpenAPI JSON for this service; the gateway Swagger UI (/api/docs) reads it through /api/v1/internship/api-docs.
springdoc:
  api-docs:
    path: /internship/api-docs
