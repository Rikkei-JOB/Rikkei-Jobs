server:
  port: ${PROFILE_SERVICE_PORT:8082}

spring:
  application:
    name: profile-service
  datasource:
    url: ${PROFILE_DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rikkei_jobs}}
    username: ${PROFILE_DB_USER:${POSTGRES_USER:postgres}}
    password: ${PROFILE_DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: profile
  flyway:
    enabled: true
    schemas: profile
    default-schema: profile
    locations: classpath:db/migration

app:
  profile:
    demo-data-enabled: false
  jwt:
    # Must equal identity-service's JWT_SECRET: tokens are issued there and only verified here.
    secret: ${JWT_SECRET:your_super_secret_jwt_key_at_least_256_bits_long_rikkei_jobs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never


# OpenAPI JSON for this service; the gateway Swagger UI (/api/docs) reads it through /api/v1/profile/api-docs.
springdoc:
  api-docs:
    path: /profile/api-docs
