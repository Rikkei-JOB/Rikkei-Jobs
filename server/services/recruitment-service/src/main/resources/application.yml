server:
  port: ${RECRUITMENT_SERVICE_PORT:8083}

spring:
  application:
    name: recruitment-service
  datasource:
    url: ${RECRUITMENT_DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rikkei_jobs}}
    username: ${RECRUITMENT_DB_USER:${POSTGRES_USER:postgres}}
    password: ${RECRUITMENT_DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: recruitment
  flyway:
    enabled: true
    schemas: recruitment
    default-schema: recruitment
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  recruitment:
    cv-storage-dir: ${RECRUITMENT_CV_STORAGE_DIR:.runtime/recruitment-cvs}
    company-base-url: ${COMPANY_SERVICE_URL:http://localhost:8085}
    job-context-path: ${RECRUITMENT_JOB_CONTEXT_PATH:/internal/jobs/{jobId}/application-context}
    company-service-key: ${RECRUITMENT_COMPANY_SERVICE_KEY:${INTERNAL_SERVICE_KEY:}}
    profile-base-url: ${PROFILE_SERVICE_URL:http://localhost:8082}
    cv-pdf-path: ${RECRUITMENT_CV_PDF_PATH:/profile/cvs/{cvId}/pdf}
    outbox-enabled: ${RECRUITMENT_OUTBOX_ENABLED:true}
    mail-from: ${MAIL_FROM:no-reply@rikkei-jobs.local}
  jwt:
    # Must equal identity-service's JWT_SECRET: tokens are issued there and only verified here.
    secret: ${JWT_SECRET:your_super_secret_jwt_key_at_least_256_bits_long_rikkei_jobs}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never


# OpenAPI JSON for this service; the gateway Swagger UI (/api/docs) reads it through /api/v1/recruitment/api-docs.
springdoc:
  api-docs:
    path: /recruitment/api-docs
