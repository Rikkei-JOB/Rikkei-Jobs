server:
  port: ${COMPANY_SERVICE_PORT:8085}

spring:
  application:
    name: company-service
  datasource:
    url: ${COMPANY_DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rikkei_jobs}}
    username: ${COMPANY_DB_USER:${POSTGRES_USER:postgres}}
    password: ${COMPANY_DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: ${COMPANY_DB_SCHEMA:company}
  flyway:
    enabled: true
    schemas: ${COMPANY_DB_SCHEMA:company}
    default-schema: ${COMPANY_DB_SCHEMA:company}
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB

app:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  internal:
    service-key: ${INTERNAL_SERVICE_KEY:dev-internal-key}
  upload:
    dir: ${COMPANY_UPLOAD_DIR:./data/uploads}
  dev-data:
    enabled: ${DEV_DATA_ENABLED:false}
  jwt:
    # Must equal identity-service's JWT_SECRET: tokens are issued there and only verified here.
    secret: ${JWT_SECRET:your_super_secret_jwt_key_at_least_256_bits_long_rikkei_jobs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never


# OpenAPI JSON for this service; the gateway Swagger UI (/api/docs) reads it through /api/v1/company/api-docs.
springdoc:
  api-docs:
    path: /company/api-docs
